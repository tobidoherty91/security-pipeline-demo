name: Security Scan
on: [push]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install bandit safety
      
      - name: Run bandit
        run: bandit -r . -f json -o bandit.json || true
        # || true prevents failure if bandit finds issues (we'll check manually)
      
      - name: Check for high severity bandit issues
        run: |
          if [ -f bandit.json ]; then
            if grep -q '"issue_severity": "HIGH"' bandit.json; then
              echo "High severity issues found!"
              exit 1
            fi
          else
            echo "bandit.json not found, skipping..."
          fi
      
      - name: Upgrade setuptools to fix CVE-2026-59890
        run: pip install --upgrade setuptools
      
      - name: Run safety check
        run: safety check
